<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통인 강남역삼점 고객 DB</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f5f6f8;color:#222}
header{background:#111;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px} header p{margin:5px 0 0;font-size:12px;color:#bbb}
nav{display:flex;gap:6px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:73px;z-index:4}
nav button{border:0;background:#eee;border-radius:20px;padding:9px 14px;white-space:nowrap}
nav button.active{background:#111;color:#fff}
main{max-width:900px;margin:auto;padding:14px}
.page{display:none}.page.active{display:block}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.card{background:#fff;border-radius:12px;padding:15px;box-shadow:0 1px 5px #ddd}.card small{color:#777}.card b{display:block;font-size:24px;margin-top:6px}
.panel{background:#fff;border-radius:12px;padding:15px;margin-bottom:14px;box-shadow:0 1px 5px #ddd}
h2{font-size:17px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:12px;color:#666}input,select,textarea{width:100%;padding:11px;margin-top:5px;border:1px solid #ddd;border-radius:8px;font-size:14px}
textarea{min-height:80px;resize:vertical}.full{grid-column:1/-1}
.btn{border:0;border-radius:8px;padding:11px 15px;background:#111;color:#fff;font-weight:bold}.btn.gray{background:#eee;color:#222}.btn.red{background:#c62828}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.search{margin-bottom:10px}.customer{border:1px solid #eee;border-radius:10px;padding:13px;margin:8px 0}
.customer strong{font-size:16px}.tag{display:inline-block;background:#eee;border-radius:12px;padding:4px 8px;font-size:11px;margin:3px 2px}
.list-tools{display:grid;grid-template-columns:1fr 180px;gap:8px;margin-bottom:10px}.list-tools .search,.list-tools select{margin:0}
.subtle{font-size:12px;color:#777;line-height:1.5;margin-top:-5px}.subpanel{border-top:1px solid #eee;margin-top:18px;padding-top:18px}
.auto-save-bar{background:#e8f5e9;border:1px solid #b7dfba;border-radius:10px;padding:10px;margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.auto-save-bar span{font-size:12px;color:#2e7d32}.auto-save-bar .btn{background:#2e7d32;white-space:nowrap}.auto-fixed-save{display:none;position:fixed;left:0;right:0;bottom:0;z-index:1000;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid #ddd;box-shadow:0 -3px 12px rgba(0,0,0,.12)}.auto-fixed-save.show{display:block}.auto-fixed-save button{width:100%;min-height:54px;border:0;border-radius:12px;background:#188038;color:#fff;font-size:17px;font-weight:700}.auto-fixed-save button:disabled{opacity:.55}.auto-result-visible main{padding-bottom:92px}
.empty{text-align:center;color:#888;padding:30px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.cards{grid-template-columns:1fr 1fr}.list-tools{grid-template-columns:1fr}}
</style>
<link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#111111"></head>
<body>
<header><h1>통인 강남역삼점 고객 DB <span style="font-size:11px;font-weight:400;opacity:.65">v21</span></h1><p>견적 · 계약 · 이사 고객관리 1차 버전</p></header>
<nav>
<button class="active" data-page="home" onclick="showPage('home',this)">홈</button>
<button data-page="estimateList" onclick="showPage('estimateList',this)">견적예정</button>
<button data-page="unsignedList" onclick="showPage('unsignedList',this)">미계약</button>
<button data-page="cancelList" onclick="showPage('cancelList',this)">계약취소</button>
<button data-page="contractList" onclick="showPage('contractList',this)">계약완료</button>
<button data-page="add" onclick="openCustomerRegistration(this)">고객등록</button>
</nav>
<main>


<section id="home" class="page active">
  <div class="panel">
    <h2>월별 고객 현황</h2>

    <div id="yearButtons" style="display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px"></div>

    <h3 id="yearTitle" style="margin:8px 0 10px;font-size:16px"></h3>

    <div id="monthButtons" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 14px">
      <button class="btn gray month-btn" onclick="showMonth(1,this)">1월</button>
      <button class="btn gray month-btn" onclick="showMonth(2,this)">2월</button>
      <button class="btn gray month-btn" onclick="showMonth(3,this)">3월</button>
      <button class="btn gray month-btn" onclick="showMonth(4,this)">4월</button>
      <button class="btn gray month-btn" onclick="showMonth(5,this)">5월</button>
      <button class="btn gray month-btn" onclick="showMonth(6,this)">6월</button>
      <button class="btn gray month-btn" onclick="showMonth(7,this)">7월</button>
      <button class="btn gray month-btn" onclick="showMonth(8,this)">8월</button>
      <button class="btn gray month-btn" onclick="showMonth(9,this)">9월</button>
      <button class="btn gray month-btn" onclick="showMonth(10,this)">10월</button>
      <button class="btn gray month-btn" onclick="showMonth(11,this)">11월</button>
      <button class="btn gray month-btn" onclick="showMonth(12,this)">12월</button>
    </div>

    <h3 id="monthTitle" style="margin:14px 0 10px;font-size:16px">월을 선택하세요</h3>

    <div class="cards">
      <div class="card"><small>등록고객</small><b id="mTotal">0</b></div>
      <div class="card"><small>계약고객</small><b id="mContract">0</b></div>
      <div class="card"><small>견적예정</small><b id="mEstimate">0</b></div>
      <div class="card"><small>미계약</small><b id="mUnsigned">0</b></div>
      <div class="card"><small>계약취소</small><b id="mCancelled">0</b></div>
      <div class="card"><small>계약률</small><b id="mRate">0%</b></div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px">
      <button id="monthAllBtn" class="btn" onclick="setMonthDetail('all',this)">등록고객</button>
      <button id="monthContractBtn" class="btn gray" onclick="setMonthDetail('contract',this)">계약고객</button>
      <button id="monthDateBtn" class="btn gray" onclick="setMonthDetail('date',this)">이달의이사</button>
    </div>

    <div id="monthDetailTitle" style="font-weight:700;margin:14px 0 8px">등록고객</div>
    <div id="monthCustomerList"></div>
  </div>
</section>


<section id="estimateList" class="page"><div class="panel"><h2>견적예정 고객</h2><div class="list-tools"><input class="search" id="search-estimate" placeholder="이름, 전화번호, 주소 검색" oninput="renderLists()"><select id="sort-estimate" onchange="syncSort(this.value)"><option value="created">등록일자순</option><option value="moveDate">이사날짜순</option></select></div><div id="list-estimate"></div></div></section>
<section id="unsignedList" class="page"><div class="panel"><h2>미계약 고객</h2>
<div class="list-tools"><input class="search" id="search-unsigned" placeholder="이름, 전화번호, 주소 검색" oninput="renderLists()"><select id="sort-unsigned" onchange="syncSort(this.value)"><option value="created">등록일자순</option><option value="moveDate">이사날짜순</option></select></div><div id="list-unsigned"></div></div></section>
<section id="cancelList" class="page"><div class="panel"><h2>계약취소 고객</h2>
<div class="list-tools"><input class="search" id="search-cancel" placeholder="이름, 전화번호, 주소 검색" oninput="renderLists()">
<select id="sort-cancel" onchange="syncSort(this.value)"><option value="created">등록일자순</option><option value="moveDate">이사날짜순</option></select></div>
<div id="list-cancel"></div></div></section>

<section id="contractList" class="page"><div class="panel"><h2>계약완료 고객</h2><div class="list-tools"><input class="search" id="search-contract" placeholder="이름, 전화번호, 주소 검색" oninput="renderLists()"><select id="sort-contract" onchange="syncSort(this.value)"><option value="created">등록일자순</option><option value="moveDate">이사날짜순</option></select></div><div id="list-contract"></div></div></section>

<section id="add" class="page">
<div class="panel"><h2 id="formTitle">고객 등록</h2>
<form id="form"><div class="grid">
<div><label>고객명<input id="name" required></div>
<div><label>연락처<input id="phone" required></div>
<div><label>이사 날짜<input id="date" type="date"></div>
<div><label>평수<input id="size" placeholder="예: 24평"></div>
<div><label>출발지<input id="from"></div>
<div><label>도착지<input id="to"></div>
<div><label>이사 종류<select id="type"><option>스탠다드</option><option>프리미엄</option><option>반포장</option></select></div>
<div><label>유입경로<select id="source"><option>소개</option><option>본사</option><option>플랫폼</option><option>부동산</option><option>기타</option></select></div>
<div><label>고객상태<select id="status"><option selected>견적예정</option><option>미계약</option><option>계약취소</option><option>계약완료</option></select></div>
<div><label>견적금액<input id="price" type="number" placeholder="원"></div>
<div class="full"><label>상담내용<textarea id="memo"></textarea></div>
</div><div class="actions"><button class="btn" type="submit">저장</button><button class="btn gray" type="button" onclick="resetForm()">초기화</button></div>
</form>
<div class="subpanel"><h2>📩 문자 자동등록</h2>
<p class="subtle">통인CS 문자를 그대로 붙여넣으면 고객명, 연락처, 이사일, 출발지, 도착지, 이사종류 등을 자동으로 찾아 등록할 수 있습니다.</p>
<textarea id="smsInput" placeholder="문자 내용을 그대로 붙여넣어 주세요."></textarea>
<div class="actions"><button class="btn" type="button" onclick="parseSMS()">자동으로 정보 추출</button><button class="btn gray" type="button" onclick="document.getElementById('smsInput').value=''">지우기</button></div>
<div id="parseNotice"></div>
</div>
<div class="subpanel" id="autoResult" style="display:none"><h2>자동 입력 결과</h2>
<div class="auto-save-bar"><span>내용 확인 후 고객DB에 저장하세요.</span><button class="btn" type="button" onclick="saveAutoCustomer()">고객DB 저장</button></div>
<div class="grid">
<div><label>고객명<input id="a_name"></div>
<div><label>연락처<input id="a_phone"></div>
<div><label>이사 날짜<input id="a_date" type="date"></div>
<div><label>평수<input id="a_size" placeholder="예: 34평"></div>
<div><label>출발지<input id="a_from"></div>
<div><label>도착지<input id="a_to"></div>
<div><label>이사 종류<input id="a_type"></div>
<div><label>유입경로<select id="a_source"><option>소개</option><option>본사</option><option>플랫폼</option><option>부동산</option><option>기타</option></select></div>
<div><label>고객상태<select id="a_status"><option selected>견적예정</option><option>미계약</option><option>계약취소</option><option>계약완료</option></select></div>
<div><label>견적금액<input id="a_price" type="number" placeholder="원"></div>
<div class="full"><label>상담내용<textarea id="a_memo"></textarea></div>
</div>
<div class="actions"><button class="btn" type="button" onclick="saveAutoCustomer()">고객DB 저장</button><button class="btn gray" type="button" onclick="document.getElementById('autoResult').scrollIntoView({behavior:'smooth'})">결과 상단으로</button></div>
</div></section>
</main>
<div id="autoFixedSave" class="auto-fixed-save"><button id="autoFixedSaveBtn" type="button" onclick="saveAutoCustomer()">고객DB에 등록하기</button></div>
<script>
let data=JSON.parse(localStorage.getItem('tonginCustomers')||'[]'), editId=null;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem('tonginCustomers',JSON.stringify(data));updateDash();renderLists()}
function navButton(page){return document.querySelector(`nav button[data-page="${page}"]`)}
function showPage(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));(btn||navButton(id)).classList.add('active');if(id!=='add'&&id!=='home')renderLists();if(id==='home')updateDash()}
function isContract(x){return x.status==='계약완료'||x.status==='계약'}
function isUnsigned(x){return x.status==='미계약'||['견적완료','보류','취소'].includes(x.status)}
function updateDash(){
  renderYearButtons();
  if(selectedMonth) renderMonthSummary(selectedMonth);
}


let selectedMonth=null;
let selectedYear=new Date().getFullYear();
let monthDetailMode='all';

function createdYearMonth(x){
  const ts=Number(x.created||0);
  if(!ts) return null;
  const d=new Date(ts);
  if(Number.isNaN(d.getTime())) return null;
  return {year:d.getFullYear(), month:d.getMonth()+1};
}

function moveYearMonth(x){
  const d=String(x.date||'').trim();
  const m=d.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? {year:Number(m[1]), month:Number(m[2])} : null;
}

function availableYears(){
  const years=new Set([new Date().getFullYear()]);

  data.forEach(x=>{
    const created=createdYearMonth(x);
    const move=moveYearMonth(x);
    if(created) years.add(created.year);
    if(move) years.add(move.year);
  });

  return [...years].sort((a,b)=>a-b);
}

function renderYearButtons(){
  const years=availableYears();
  if(!years.includes(selectedYear)) selectedYear=years[years.length-1];

  const box=$('yearButtons');
  if(!box) return;

  box.innerHTML=years.map(y=>
    `<button class="${y===selectedYear?'btn':'btn gray'} year-btn" onclick="selectYear(${y},this)" style="min-width:84px;white-space:nowrap">${y}년</button>`
  ).join('');

  if($('yearTitle')) $('yearTitle').textContent=selectedYear+'년 월별 등록고객 현황';
}

function selectYear(year,btn){
  selectedYear=year;
  selectedMonth=null;
  monthDetailMode='all';

  document.querySelectorAll('.year-btn').forEach(b=>b.className='btn gray year-btn');
  if(btn) btn.className='btn year-btn';

  document.querySelectorAll('.month-btn').forEach(b=>b.className='btn gray month-btn');

  if($('yearTitle')) $('yearTitle').textContent=selectedYear+'년 월별 등록고객 현황';
  if($('monthTitle')) $('monthTitle').textContent='월을 선택하세요';

  ['mTotal','mContract','mEstimate','mUnsigned','mCancelled'].forEach(id=>{if($(id)) $(id).textContent='0';});
  if($('mRate')) $('mRate').textContent='0%';
  if($('monthDetailTitle')) $('monthDetailTitle').textContent='등록고객';
  if($('monthCustomerList')) $('monthCustomerList').innerHTML='<div class="empty">확인할 월을 선택하세요.</div>';

  const a=$('monthAllBtn'), c=$('monthContractBtn'), d=$('monthDateBtn');
  if(a&&c&&d){a.className='btn';c.className='btn gray';d.className='btn gray';}
}

function registeredInMonth(x,year,month){
  const ym=createdYearMonth(x);
  return !!ym && ym.year===year && ym.month===month;
}

function movingInMonth(x,year,month){
  const ym=moveYearMonth(x);
  return !!ym && ym.year===year && ym.month===month;
}

function showMonth(month,btn){
  selectedMonth=month;
  monthDetailMode='all';

  document.querySelectorAll('.month-btn').forEach(b=>b.className='btn gray month-btn');
  if(btn) btn.className='btn month-btn';

  const a=$('monthAllBtn'), c=$('monthContractBtn'), d=$('monthDateBtn');
  if(a&&c&&d){a.className='btn';c.className='btn gray';d.className='btn gray';}

  renderMonthSummary(month);
}

function renderMonthSummary(month){
  const registered=sortCustomers(
    data.filter(x=>registeredInMonth(x,selectedYear,month)),
    'created'
  );

  const contract=registered.filter(isContract).length;
  const estimate=registered.filter(x=>x.status==='견적예정').length;
  const unsigned=registered.filter(isUnsigned).length;
  const cancelled=registered.filter(x=>x.status==='계약취소').length;

  const decided=contract+unsigned+cancelled;
  const rate=decided ? Math.round((contract/decided)*100) : 0;

  $('monthTitle').textContent=selectedYear+'년 '+month+'월 등록고객 현황';
  $('mTotal').textContent=registered.length;
  $('mContract').textContent=contract;
  $('mEstimate').textContent=estimate;
  $('mUnsigned').textContent=unsigned;
  $('mCancelled').textContent=cancelled;
  $('mRate').textContent=rate+'%';

  renderMonthDetail();
}

function setMonthDetail(mode,btn){
  monthDetailMode=mode;

  const a=$('monthAllBtn'), c=$('monthContractBtn'), d=$('monthDateBtn');
  if(a&&c&&d){
    a.className=mode==='all'?'btn':'btn gray';
    c.className=mode==='contract'?'btn':'btn gray';
    d.className=mode==='date'?'btn':'btn gray';
  }

  renderMonthDetail();
}

function renderMonthDetail(){
  if(!selectedMonth) return;

  const box=$('monthCustomerList');
  const title=$('monthDetailTitle');

  const registered=sortCustomers(
    data.filter(x=>registeredInMonth(x,selectedYear,selectedMonth)),
    'created'
  );

  if(monthDetailMode==='contract'){
    const contracts=registered.filter(isContract);
    title.textContent=selectedYear+'년 '+selectedMonth+'월 등록고객 중 계약고객 ('+contracts.length+'명)';
    box.innerHTML=contracts.length
      ? contracts.map(card).join('')
      : '<div class="empty">계약고객이 없습니다.</div>';
    return;
  }

  if(monthDetailMode==='date'){
    const moves=sortCustomers(
      data.filter(x=>movingInMonth(x,selectedYear,selectedMonth)),
      'moveDate'
    );
    title.textContent=selectedYear+'년 '+selectedMonth+'월 이달의이사 ('+moves.length+'명)';
    box.innerHTML=moves.length
      ? moves.map(card).join('')
      : '<div class="empty">이달의 이사 고객이 없습니다.</div>';
    return;
  }

  title.textContent=selectedYear+'년 '+selectedMonth+'월 등록고객 ('+registered.length+'명)';
  box.innerHTML=registered.length
    ? registered.map(card).join('')
    : '<div class="empty">등록고객이 없습니다.</div>';
}

function displayName(x){if(!x.date)return esc(x.name);const digits=x.date.replace(/\D/g,'');return esc((digits.length>=8?digits.slice(2,8):'')+x.name)}
function shortArea(addr){
  const s=String(addr||'').trim().replace(/\s+/g,' ');
  if(!s) return '-';
  const parts=s.split(' ');
  const first=parts[0]||'';
  const second=parts[1]||'';

  // 경기도/강원도/충청도/전라도/경상도/제주도 등 → 시/군 표시
  if(/(도|특별자치도)$/.test(first) && second) return second;

  // 서울/부산/대구/인천/광주/대전/울산 등 → 구/군 표시
  if(/(특별시|광역시)$/.test(first) && second) return second;

  // 세종특별자치시
  if(first.includes('세종')) return '세종시';

  // 그 외에는 앞쪽 행정구역 중 시/군/구 우선
  const found=parts.find(p=>/(시|군|구)$/.test(p));
  return found||first||'-';
}

function weekdayText(dateStr){
  if(!dateStr) return '';
  const m=String(dateStr).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return '';
  const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
  return ['일','월','화','수','목','금','토'][d.getDay()]||'';
}

function formatCost(v){
  const n=Number(String(v||'').replace(/[^\d.-]/g,''));
  if(!n) return '총비용 -';
  if(n>=10000){
    const man=n/10000;
    const txt=Number.isInteger(man)?man.toLocaleString('ko-KR'):man.toLocaleString('ko-KR',{maximumFractionDigits:1});
    return '총비용 '+txt+'만원';
  }
  return '총비용 '+n.toLocaleString('ko-KR')+'원';
}

function card(x){
  const day=weekdayText(x.date);
  const dateText=x.date ? x.date+day : '날짜 미정';
  const route=shortArea(x.from)+'-'+shortArea(x.to);
  return `<div class="customer"><strong>${displayName(x)}</strong> <span class="tag">${esc(x.status)}</span><br><small>${esc(x.phone)} / ${esc(dateText)} / ${esc(route)} / ${esc(formatCost(x.price))}</small><div class="actions"><button class="btn gray" onclick="edit('${x.id}')">수정</button><button class="btn red" onclick="del('${x.id}')">삭제</button></div></div>`
}
function sortCustomers(arr,mode){return arr.slice().sort((a,b)=>{if(mode==='moveDate'){if(!a.date&&!b.date)return (b.created||0)-(a.created||0);if(!a.date)return 1;if(!b.date)return -1;return a.date.localeCompare(b.date)||(b.created||0)-(a.created||0)}return (b.created||0)-(a.created||0)})}
function matchesSearch(x,q){return !q||[x.name,x.phone,x.from,x.to,displayName(x).replace(/&[^;]+;/g,'')].join(' ').toLowerCase().includes(q)}
function fillList(kind,filter){const q=($('search-'+kind)?.value||'').toLowerCase(),mode=$('sort-'+kind)?.value||'created';const arr=sortCustomers(data.filter(x=>filter(x)&&matchesSearch(x,q)),mode);$('list-'+kind).innerHTML=arr.map(card).join('')||'<div class="empty">조건에 맞는 고객이 없습니다.</div>'}
function renderLists(){
 fillList('estimate',x=>x.status==='견적예정');
 fillList('unsigned',isUnsigned);
 fillList('cancel',x=>x.status==='계약취소');
 fillList('contract',isContract);
}

 return 'estimateList';
}

function resetForm(){editId=null;$('form').reset();$('formTitle').textContent='고객 등록';if($('status'))$('status').value='견적예정'}
function firstMatch(text, patterns){for(const p of patterns){const m=text.match(p);if(m&&m[1])return m[1].trim()}return ''}
function normalizeDate(v){if(!v)return '';let m=v.match(/(20\d{2})\s*[\/\-.]?\s*(\d{1,2})\s*[\/\-.]?\s*(\d{1,2})/);if(!m){m=v.match(/(20\d{2})(\d{2})(\d{2})/)}return m?`${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`:''}
function lineAfterLabel(text, labels){
 const source=String(text||'').replace(/\r/g,'');
 const rawLines=source.split('\n');
 const knownLabels='고객명|고객\s*성함|성함|고객전화|연락처|전화번호|출발지|현주소|현주소지|출발\s*주소|이전\s*주소|출발지\s*주소|도착지|후주소|후주소지|도착\s*주소|새\s*주소|도착지\s*주소|이사날짜|이사일|이사\s*날짜|이사예정일|이사종류|이사\s*종류|평형|평수|평\s*수|주거형태|전달사항|상품명|매칭업체수|접수일시';
 const known=new RegExp('^\\s*[＊*•·▪︎■□▶▷-]?\\s*(?:'+knownLabels+')\\s*[:：]?','i');
 // 1) 줄바꿈이 유지된 문자 형식
 for(let i=0;i<rawLines.length;i++){
  const line=rawLines[i].trim();
  for(const label of labels){
   const re=new RegExp('^\\s*[＊*•·▪︎■□▶▷-]?\\s*'+label+'\\s*[:：]?\\s*(.*)$','i');
   const m=line.match(re);
   if(m){
    let value=(m[1]||'').trim();
    let j=i+1;
    while(j<rawLines.length){
     const next=rawLines[j].trim();
     if(!next){j++;continue}
     if(known.test(next) || /^방문견적\s*희망일/i.test(next) || /^☎/.test(next)) break;
     if(value) value+=' '+next; else value=next;
     j++;
    }
    return value.trim();
   }
  }
 }
 // 2) 카카오톡/문자 복사 시 전체 내용이 한 줄로 붙는 형식
 const flat=source.replace(/\s+/g,' ').trim();
 for(const label of labels){
  const re=new RegExp('(?:^|\\s)[＊*•·▪︎■□▶▷-]?\\s*'+label+'\\s*[:：]?\\s*(.*?)(?=\\s+(?:[＊*•·▪︎■□▶▷-]?\\s*)?(?:'+knownLabels+'|방문견적\\s*희망일)\\s*[:：]?|\\s+[▶★☎]|$)','i');
  const m=flat.match(re);
  if(m) return (m[1]||'').trim();
 }
 return '';
}
window.parseSMS=function(){
 const t=$('smsInput').value||'';
 let name=firstMatch(t,[/(?:고객명|고객\s*성함|성함)\s*[:：]?\s*([가-힣]{2,10})/i,/([가-힣]{2,10})\s*고객님/,/([가-힣]{2,10})\s*님(?:\s|$)/]);
 let phone=firstMatch(t,[/(01[016789][-\s]?\d{3,4}[-\s]?\d{4})/]); phone=phone.replace(/\s/g,'');
 let dateRaw=firstMatch(t,[/(?:이사날짜|이사일|이사\s*날짜|이사예정일)\s*[:：]?\s*([^\n]+)/i]);
 if(!dateRaw) dateRaw=firstMatch(t,[/(20\d{2}\s*\d{1,2}\s*\d{1,2})\s*(?:월|년|\/|-|\.)?\s*\d*/]);
 let date=normalizeDate(dateRaw);
 const flatText=String(t||'').replace(/\r?\n/g,' ').replace(/\s+/g,' ').trim();
 const fieldEnd='고객명|고객\\s*성함|성함|고객전화|연락처|전화번호|출발지|현주소|현주소지|출발\\s*주소|이전\\s*주소|출발지\\s*주소|도착지|후주소|후주소지|도착\\s*주소|새\\s*주소|도착지\\s*주소|견적일|이사날짜|이사일|이사\\s*날짜|이사예정일|이사종류|이사\\s*종류|평형|평수|평\\s*수|주거형태|전달사항|상품명|매칭업체수|접수일시';
 function extractFlatField(labels){
   for(const label of labels){
     const re=new RegExp('(?:^|\\s)[*＊]?\\s*(?:'+label+')\\s*[:：]\\s*(.*?)(?=\\s+[*＊]?\\s*(?:'+fieldEnd+')\\s*[:：]|\\s+[▶★☎]|$)','i');
     const m=flatText.match(re);
     if(m&&m[1]) return m[1].trim();
   }
   return '';
 }
 let from=extractFlatField(['출발지','현주소','현주소지','출발\\s*주소','이전\\s*주소','출발지\\s*주소']);
 let to=extractFlatField(['도착지','후주소','후주소지','도착\\s*주소','새\\s*주소','도착지\\s*주소']);
 if(!from) from=lineAfterLabel(t,['출발지','현주소','현주소지','출발\\s*주소','이전\\s*주소','출발지\\s*주소']);
 if(!to) to=lineAfterLabel(t,['도착지','후주소','후주소지','도착\\s*주소','새\\s*주소','도착지\\s*주소']);
 let type=lineAfterLabel(t,['이사종류','이사\s*종류']);
 let size=lineAfterLabel(t,['평형','평수','평\s*수','주거형태']);
 if(!size){const m=t.match(/\((\d{1,3})\s*평\)/);if(m)size=m[1]+'평'}
 if(from){const m=from.match(/\((\d{1,3})\s*평\)\s*$/);if(m&&!size)size=m[1]+'평';from=from.replace(/\s*\(\d{1,3}\s*평\)\s*$/,'').trim()}
 let memo=[];
 const notice=lineAfterLabel(t,['전달사항']); if(notice) memo.push('전달사항: '+notice);
 const visit=t.match(/방문견적\s*희망일\s*(?:\n|\s)+([\s\S]*?)(?=(?:\n|\s)+☎|(?:\n|\s)+[-=]{2,}|$)/i); if(visit)memo.push('방문견적 희망일:\n'+visit[1].trim());
 const product=lineAfterLabel(t,['상품명']); if(product)memo.push('상품명: '+product);
 const match=lineAfterLabel(t,['매칭업체수']); if(match)memo.push('매칭업체수: '+match);
 const receive=lineAfterLabel(t,['접수일시']); if(receive)memo.push('접수일시: '+receive);
 const allOther=t.match(/본사이벤트[^\n]*/i); if(allOther)memo.push(allOther[0].trim());
 $('a_name').value=name;$('a_phone').value=phone;$('a_date').value=date;$('a_size').value=size;$('a_from').value=from;$('a_to').value=to;$('a_type').value=type;$('a_source').value=/\[통인CS\]/i.test(t)?'본사':'플랫폼';$('a_memo').value=memo.join('\n');
 $('autoResult').style.display='block';$('autoFixedSave').classList.add('show');document.body.classList.add('auto-result-visible');
 const missing=[];if(!name)missing.push('고객명');if(!phone)missing.push('연락처');if(!date)missing.push('이사일');if(!from)missing.push('출발지');if(!to)missing.push('도착지');
 $('parseNotice').innerHTML=missing.length?'<div style="margin-top:10px;padding:10px;border-radius:8px;background:#fff3cd;color:#856404;font-size:12px">확인 필요: '+missing.join(', ')+'<br>자동 추출 결과는 아래에서 직접 수정할 수 있습니다.<br><b>버전: v21</b></div>':'<div style="margin-top:10px;padding:10px;border-radius:8px;background:#e8f5e9;color:#2e7d32;font-size:12px">자동 추출 완료! 내용을 확인한 뒤 등록하세요.<br><b>버전: v21</b></div>';
 $('autoResult').scrollIntoView({behavior:'smooth'});
}
